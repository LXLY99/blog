<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LXLY 博客主页</title>
    <style>
        /* 复用你提供的 CSS，为了篇幅省略了部分通用重置，重点保留布局和玻璃拟态 */
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none !important; -webkit-tap-highlight-color: transparent !important; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; background: #0a0a0a; min-height: 100vh; overflow-x: hidden; }
        .bg-image { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; opacity: 0.85; }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.6) 100%); z-index: 1; }

        /* 导航栏 */
        .card-nav-container { position: fixed; top: 2em; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; z-index: 99; }
        .card-nav { height: 60px; background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(40px); border-radius: 0.75rem; position: relative; overflow: hidden; transition: height 0.4s; display: flex; align-items: center; padding: 0 15px; justify-content: space-between; }
        .logo-container { font-weight: 700; font-size: 1.2rem; }
        .nav-links a { margin-left: 15px; text-decoration: none; color: #333; font-weight: 500; font-size: 0.9rem; }
        .nav-links a:hover { color: #1e3a8a; }

        /* 主布局 */
        .main-container { position: relative; z-index: 2; max-width: 1400px; margin: 0 auto; padding: 120px 20px 40px; display: grid; grid-template-columns: 300px 1fr 300px; gap: 30px; align-items: start; }

        /* 卡片通用样式 (玻璃拟态) */
        .glass-card { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 1rem; padding: 25px; margin-bottom: 20px; transition: transform 0.3s; }
        .glass-card:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.85); }

        /* 侧边栏元素 */
        .profile-avatar { width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 15px; background: #eee; overflow: hidden; }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-nickname { text-align: center; font-size: 1.4rem; font-weight: 700; margin-bottom: 5px; }
        .profile-bio { text-align: center; color: #666; font-size: 0.9rem; margin-bottom: 15px; }

        /* 文章列表 */
        .post-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .post-item { background: rgba(255, 255, 255, 0.8); border-radius: 1rem; overflow: hidden; text-decoration: none; color: inherit; transition: all 0.3s; display: flex; flex-direction: column; height: 100%; }
        .post-item:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .post-cover { width: 100%; height: 180px; object-fit: cover; background: #ddd; }
        .post-content { padding: 20px; flex: 1; display: flex; flex-direction: column; }
        .post-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 10px; }
        .post-meta { margin-top: auto; font-size: 0.85rem; color: #666; display: flex; gap: 10px; }
        .tag { background: rgba(0,0,0,0.1); padding: 2px 8px; border-radius: 4px; }

        /* 服务器状态 (圆形进度条) */
        .server-metrics { display: flex; justify-content: space-around; margin-top: 15px; }
        .circular-progress { position: relative; width: 80px; height: 80px; }
        .circular-progress svg { transform: rotate(-90deg); width: 80px; height: 80px; }
        .progress-bg { fill: none; stroke: #e5e7eb; stroke-width: 6; }
        .progress-fill { fill: none; stroke: #3b82f6; stroke-width: 6; stroke-dasharray: 220; stroke-dashoffset: 220; transition: stroke-dashoffset 0.5s; stroke-linecap: round; }
        .progress-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        .progress-val { display: block; font-weight: 700; font-size: 14px; }
        .progress-label { font-size: 10px; color: #666; }

        /* 响应式 */
        @media (max-width: 1024px) { .main-container { grid-template-columns: 280px 1fr; } .sidebar-right { display: none; } }
        @media (max-width: 768px) { .main-container { grid-template-columns: 1fr; } .sidebar-left { display: none; } .post-list { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<img class="bg-image" src="./BG/BG.png" alt="BG">
<div class="bg-overlay"></div>

<div class="card-nav-container">
    <nav class="card-nav">
        <div class="logo-container">LXLY Blog</div>
        <div class="nav-links">
            <a href="#">首页</a>
            <a href="profile.html" style="color: #1e3a8a; font-weight: bold;">个人中心</a>
            <a href="index.html">退出</a>
        </div>
    </nav>
</div>

<div class="main-container">
    <aside class="sidebar-left">
        <div class="glass-card">
            <div class="profile-avatar"><img src="./BG/icon.jpg" alt="Avatar" onerror="this.src='https://via.placeholder.com/100'"></div>
            <div class="profile-nickname">LXLY</div>
            <div class="profile-bio">2945706262@qq.com<br>Java Developer / Conan Fan</div>
            <div style="margin-top:15px; border-top:1px solid rgba(0,0,0,0.1); padding-top:10px;">
                <p style="font-size:0.9rem;">公告：后端 API 正在模拟运行中...</p>
            </div>
        </div>

        <div class="glass-card">
            <h4>分类 (Categories)</h4>
            <div style="margin-top:10px; display:flex; flex-wrap:wrap; gap:8px;">
                <span class="tag">Java (12)</span>
                <span class="tag">Life (5)</span>
                <span class="tag">MinIO (3)</span>
            </div>
        </div>
    </aside>

    <main class="post-list" id="postList">
    </main>

    <aside class="sidebar-right">
        <div class="glass-card">
            <h4>服务器状态 (Server Load)</h4>
            <div class="server-metrics">
                <div class="circular-progress">
                    <svg><circle class="progress-bg" cx="40" cy="40" r="35"/><circle class="progress-fill" id="cpuCircle" cx="40" cy="40" r="35"/></svg>
                    <div class="progress-text"><span class="progress-val" id="cpuVal">0%</span><span class="progress-label">CPU</span></div>
                </div>
                <div class="circular-progress">
                    <svg><circle class="progress-bg" cx="40" cy="40" r="35"/><circle class="progress-fill" id="memCircle" cx="40" cy="40" r="35"/></svg>
                    <div class="progress-text"><span class="progress-val" id="memVal">0%</span><span class="progress-label">MEM</span></div>
                </div>
            </div>
            <div style="margin-top:15px; font-size:0.85rem; color:#666;">
                <div style="display:flex; justify-content:space-between;"><span>Load Avg:</span><span id="loadVal">0.12</span></div>
                <div style="display:flex; justify-content:space-between;"><span>Uptime:</span><span>24 Days</span></div>
            </div>
        </div>
    </aside>
</div>

<script>
    // 模拟文章数据
    const posts = [
        { title: "基于 MinIO 的对象存储实战", category: "Tech", tags: ["Java", "MinIO"], cover: "https://images.unsplash.com/photo-1558494949-ef526b0042a0?w=500&auto=format&fit=crop&q=60" },
        { title: "名侦探柯南剧场版观后感", category: "Life", tags: ["Anime"], cover: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500&auto=format&fit=crop&q=60" },
        { title: "Linux 服务器负载优化指南", category: "DevOps", tags: ["Linux"], cover: "https://images.unsplash.com/photo-1629654297299-c8506221ca97?w=500&auto=format&fit=crop&q=60" },
        { title: "Spring Boot 3.0 新特性解析", category: "Tech", tags: ["Spring"], cover: null }
    ];

    // 渲染文章
    const postList = document.getElementById('postList');
    posts.forEach(post => {
        const coverHtml = post.cover ? `<img src="${post.cover}" class="post-cover">` : `<div class="post-cover" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);"></div>`;
        postList.innerHTML += `
        <a href="#" class="post-item">
            ${coverHtml}
            <div class="post-content">
                <div class="post-title">${post.title}</div>
                <div class="post-meta">
                    <span style="background:#000; color:#fff; padding:2px 6px; border-radius:4px;">${post.category}</span>
                    ${post.tags.map(t => `<span class="tag">#${t}</span>`).join('')}
                </div>
            </div>
        </a>
      `;
    });

    // 模拟服务器负载动态效果
    function updateServerStats() {
        const cpu = Math.floor(Math.random() * 30) + 10; // 模拟 10-40%
        const mem = Math.floor(Math.random() * 20) + 40; // 模拟 40-60%
        const load = (Math.random() * 0.5 + 0.1).toFixed(2);

        // 更新数值
        document.getElementById('cpuVal').innerText = cpu + '%';
        document.getElementById('memVal').innerText = mem + '%';
        document.getElementById('loadVal').innerText = load;

        // 更新圆环 (DashArray 220)
        // Offset = 220 - (percent / 100 * 220)
        document.getElementById('cpuCircle').style.strokeDashoffset = 220 - (cpu / 100 * 220);
        document.getElementById('memCircle').style.strokeDashoffset = 220 - (mem / 100 * 220);

        // 颜色警告
        document.getElementById('cpuCircle').style.stroke = cpu > 80 ? '#ef4444' : '#3b82f6';
    }

    setInterval(updateServerStats, 2000); // 每2秒更新
    updateServerStats(); // 初始调用
</script>
</body>
</html>
