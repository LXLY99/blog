<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LXLY 个人博客</title>
  <style>
    /* --- 您的原始 CSS (保持不变) --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #1a1a1d;
      background-image: url('./BG/homePage.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: -1;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.96);
      width: 100%;
      max-width: 600px;
      padding: 50px 60px;
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
      animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
      position: relative; /* 为了 Toast 定位 */
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-card h1 {
      font-size: 28px;
      color: #111827;
      margin-bottom: 15px;
      font-weight: 700;
    }

    .subtitle {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 40px;
      line-height: 1.6;
      font-weight: 500;
    }

    .heart-icon {
      color: #a855f7;
      display: inline-block;
      vertical-align: middle;
      animation: heartbeat 1.5s infinite ease-in-out;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.8; }
    }

    .form-group {
      margin-bottom: 24px;
      text-align: left;
      position: relative;
    }

    .input-field {
      width: 100%;
      padding: 12px 20px;
      border: 2px solid transparent;
      background-color: #f3f4f6;
      border-radius: 6px;
      font-size: 14px;
      color: #1f2937;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-field::placeholder {
      color: #9ca3af;
    }

    .input-field:focus {
      background-color: #ffffff;
      border-color: #1e40af;
      box-shadow: 0 0 0 4px rgba(30, 64, 175, 0.1);
    }

    .toggle-password {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
      border-radius: 50%;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: #4b5563;
      background-color: rgba(0,0,0,0.05);
    }

    .btn-login {
      width: 100%;
      background-color: #1e3a8a;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      margin-top: 20px;
    }

    .btn-login:hover {
      background-color: #172554;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(30, 58, 138, 0.3);
    }

    .btn-login:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
      box-shadow: none;
    }

    .card-footer {
      margin-top: 35px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      color: #6b7280;
      padding-top: 25px;
      border-top: 1px solid #f3f4f6;
    }

    .footer-links a {
      text-decoration: none;
      color: #6b7280;
      transition: color 0.2s;
      cursor: pointer; /* 确保链接手势 */
    }

    .footer-links a:hover {
      color: #1e3a8a;
      text-decoration: underline;
    }

    .divider {
      margin: 0 20px;
      color: #d1d5db;
    }

    /* --- 新增样式 (为了适配功能，不破坏原布局) --- */
    /* 隐藏元素的类 */
    .hidden-view {
      display: none;
    }

    /* 验证码按钮样式 (仿照密码切换按钮的定位风格) */
    .btn-code {
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #1e3a8a;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .btn-code:hover {
      background-color: rgba(30, 58, 138, 0.05);
    }
    .btn-code:disabled {
      color: #9ca3af;
      cursor: not-allowed;
    }
    /* 调整验证码输入框的内边距，防止文字被按钮遮挡 */
    .input-code {
      padding-right: 100px;
    }

    /* Toast 提示框样式 */
    .toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast-show {
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="login-card">
  <h1 id="cardTitle">LXLY 个人博客</h1>

  <p class="subtitle" id="cardSubtitle">
    少年心事当拿云，谁念幽寒坐呜呃 <span class="heart-icon">❤</span>
  </p>

  <div id="view-login">
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <input type="email" id="loginEmail" class="input-field" placeholder="LXLY@example.com" required>
      </div>

      <div class="form-group">
        <input type="password" id="loginPassword" class="input-field" placeholder="密码" required>
        <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)">
           <span class="icon-closed">
               <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M4.52 5.935L1.394 2.808l1.414-1.414l19.799 19.798l-1.414 1.415l-3.31-3.31A10.95 10.95 0 0 1 12 21c-5.392 0-9.878-3.88-10.818-9A11 11 0 0 1 4.52 5.935m10.238 10.237l-1.464-1.464a3 3 0 0 1-4.001-4.001L7.829 9.243a5 5 0 0 0 6.929 6.929M7.974 3.76C9.221 3.27 10.58 3 12 12 3c5.392 0 9.878 3.88 10.819 9a10.95 10.95 0 0 1-2.012 4.593l-3.86-3.86Q17 12.373 17 12a5 5 0 0 0-5.732-4.947z"/></svg>
           </span>
          <span class="icon-open" style="display: none;">
               <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M12 9.75a2.25 2.25 0 1 0 0 4.5a2.25 2.25 0 0 0 0-4.5"/><path fill="currentColor" fill-rule="evenodd" d="M12 5.5c-2.618 0-4.972 1.051-6.668 2.353c-.85.652-1.547 1.376-2.036 2.08c-.48.692-.796 1.418-.796 2.067s.317 1.375.796 2.066c.49.705 1.186 1.429 2.036 2.08C7.028 17.45 9.382 18.5 12 18.5s4.972-1.051 6.668-2.353c.85-.652 1.547-1.376 2.035-2.08c.48-.692.797-1.418.797-2.067s-.317-1.375-.797-2.066c-.488-.705-1.185-1.429-2.035-2.08C16.972 6.55 14.618 5.5 12 5.5M8.25 12a3.75 3.75 0 1 1 7.5 0a3.75 3.75 0 0 1-7.5 0" clip-rule="evenodd"/></svg>
           </span>
        </button>
      </div>

      <button type="submit" class="btn-login" id="btnLogin">
        登 入
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M11 7L9.6 8.4l2.6 2.6 H2v2h10.2l-2.6 2.6L11 17l5-5zm9 12h-8v2h10V3H12v2h8z"/></svg>
      </button>
    </form>

    <div class="card-footer">
      <div class="footer-links">
        <a onclick="switchView('register')">注册</a>
        <span class="divider">|</span>
        <a onclick="switchView('reset')">忘记密码</a>
      </div>
    </div>
  </div>

  <div id="view-register" class="hidden-view">
    <form onsubmit="handleRegister(event)">
      <div class="form-group">
        <input type="email" id="regEmail" class="input-field" placeholder="注册邮箱" required>
      </div>

      <div class="form-group">
        <input type="text" id="regCode" class="input-field input-code" placeholder="6位验证码" required>
        <button type="button" class="btn-code" onclick="sendCode('register', this)">获取验证码</button>
      </div>

      <div class="form-group">
        <input type="text" id="regUsername" class="input-field" placeholder="用户名" required>
      </div>

      <div class="form-group">
        <input type="password" id="regPassword" class="input-field" placeholder="设置密码" required>
      </div>

      <button type="submit" class="btn-login">
        确认注册
      </button>
    </form>

    <div class="card-footer">
      <div class="footer-links">
        <a onclick="switchView('login')">返回登录</a>
      </div>
    </div>
  </div>

  <div id="view-reset" class="hidden-view">
    <form onsubmit="handleReset(event)">
      <div class="form-group">
        <input type="email" id="resetEmail" class="input-field" placeholder="注册邮箱" required>
      </div>

      <div class="form-group">
        <input type="text" id="resetCode" class="input-field input-code" placeholder="6位验证码" required>
        <button type="button" class="btn-code" onclick="sendCode('password-reset', this)">获取验证码</button>
      </div>

      <div class="form-group">
        <input type="password" id="resetNewPassword" class="input-field" placeholder="新密码" required>
      </div>

      <button type="submit" class="btn-login">
        重置密码
      </button>
    </form>

    <div class="card-footer">
      <div class="footer-links">
        <a onclick="switchView('login')">返回登录</a>
      </div>
    </div>
  </div>

</div>

<div id="toast" class="toast-container">消息提示</div>

<script>
  // 后端接口地址 (根据您的 application.yml 配置)
  const API_BASE = 'https://lxly-blog.zeabur.app/api';

  // 显示 Toast 提示
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('toast-show');
    setTimeout(() => {
      toast.classList.remove('toast-show');
    }, 3000);
  }

  // 切换视图 (Login / Register / Reset)
  function switchView(viewName) {
    // 隐藏所有视图
    document.getElementById('view-login').style.display = 'none';
    document.getElementById('view-register').style.display = 'none';
    document.getElementById('view-reset').style.display = 'none';

    // 标题和内容重置
    const titleEl = document.getElementById('cardTitle');
    const subEl = document.getElementById('cardSubtitle');

    if (viewName === 'login') {
      document.getElementById('view-login').style.display = 'block';
      titleEl.innerText = 'LXLY 个人博客';
      subEl.style.display = 'block'; // 显示副标题
    } else if (viewName === 'register') {
      document.getElementById('view-register').style.display = 'block';
      titleEl.innerText = '注册账号';
      subEl.style.display = 'none'; // 注册页隐藏副标题，保持简洁
    } else if (viewName === 'reset') {
      document.getElementById('view-reset').style.display = 'block';
      titleEl.innerText = '重置密码';
      subEl.style.display = 'none';
    }
  }

  // 密码显隐切换 (复用您的SVG逻辑)
  function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    const iconClosed = btn.querySelector('.icon-closed');
    const iconOpen = btn.querySelector('.icon-open');

    if (input.type === 'password') {
      input.type = 'text';
      iconClosed.style.display = 'none';
      iconOpen.style.display = 'block';
    } else {
      input.type = 'password';
      iconClosed.style.display = 'block';
      iconOpen.style.display = 'none';
    }
  }

  // 1. 发送验证码
  async function sendCode(type, btn) {
    const emailInputId = type === 'register' ? 'regEmail' : 'resetEmail';
    const email = document.getElementById(emailInputId).value;

    if (!email) {
      showToast('请先输入邮箱');
      return;
    }

    // 按钮倒计时状态
    btn.disabled = true;
    let seconds = 60;
    const originalText = btn.innerText;

    // 立即开始倒计时 UI (优化体验)
    btn.innerText = `${seconds}s`;
    const timer = setInterval(() => {
      seconds--;
      btn.innerText = `${seconds}s`;
      if (seconds <= 0) {
        clearInterval(timer);
        btn.disabled = false;
        btn.innerText = "重新获取";
      }
    }, 1000);

    try {
      const res = await fetch(`${API_BASE}/send-verification-code`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, type })
      });
      const data = await res.json();

      if (data.code === 0) {
        showToast('验证码已发送，请查收邮件');
      } else {
        showToast(data.message || '发送失败');
        // 发送失败则重置按钮
        clearInterval(timer);
        btn.disabled = false;
        btn.innerText = "获取验证码";
      }
    } catch (e) {
      console.error(e);
      showToast('网络请求错误');
      clearInterval(timer);
      btn.disabled = false;
      btn.innerText = "获取验证码";
    }
  }

  // 2. 注册逻辑
  async function handleRegister(e) {
    e.preventDefault();
    const payload = {
      email: document.getElementById('regEmail').value,
      code: document.getElementById('regCode').value,
      username: document.getElementById('regUsername').value,
      password: document.getElementById('regPassword').value
    };

    try {
      const res = await fetch(`${API_BASE}/user-register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.code === 0) {
        showToast('注册成功！正在跳转登录...');
        setTimeout(() => switchView('login'), 1500);
      } else {
        showToast(data.message || '注册失败');
      }
    } catch (e) {
      showToast('网络错误');
    }
  }

  // 3. 重置密码逻辑
  async function handleReset(e) {
    e.preventDefault();
    const payload = {
      email: document.getElementById('resetEmail').value,
      code: document.getElementById('resetCode').value,
      newPassword: document.getElementById('resetNewPassword').value
    };

    try {
      const res = await fetch(`${API_BASE}/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.code === 0) {
        showToast('密码重置成功，请登录');
        setTimeout(() => switchView('login'), 1500);
      } else {
        showToast(data.message || '重置失败');
      }
    } catch (e) {
      showToast('网络错误');
    }
  }

  // 4. 登录逻辑
  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('btnLogin');
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerText = "登录中...";

    const payload = {
      email: document.getElementById('loginEmail').value,
      password: document.getElementById('loginPassword').value
    };

    try {
      const res = await fetch(`${API_BASE}/user-login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.code === 0) {
        // 保存 Token
        localStorage.setItem('token', data.data);
        showToast('登录成功！');
        setTimeout(() => {
          // ✅ NEW CODE: Redirect to the dashboard file
          window.location.href = 'home.html';
        }, 1000);
      } else {
        showToast(data.message || '登录失败');
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    } catch (e) {
      showToast('网络错误');
      btn.disabled = false;
      btn.innerHTML = originalText;
    }
  }
</script>

</body>
</html>
